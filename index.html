<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor a Calendario Maya con Glifos</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Mayan+Numerals&display=swap');
    </style>

</head>
<body>

    <div class="container">
        <h1>Convierte Fechas al Calendario Maya</h1>
        <p>Selecciona una fecha para ver su equivalente con glifos mayas.</p>

        <div class="selector-fecha" aria-label="Selector de fecha">
            <div class="selector-controles">
                <div class="campo-fecha">
                    <label for="selectDia">Día</label>
                    <select id="selectDia"></select>
                </div>
                <div class="campo-fecha campo-mes">
                    <label for="selectMes">Mes</label>
                    <select id="selectMes">
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
                <div class="campo-fecha campo-anio">
                    <label for="inputAnio">Año</label>
                    <div class="anio-grupo">
                        <input type="number" id="inputAnio" min="1" max="4772" value="2026">
                        <select id="selectEra" aria-label="Era">
                            <option value="dc">d. C.</option>
                            <option value="ac">a. C.</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="selector-acciones">
                <button type="button" class="btn-secundario" id="btnPrevDia" title="Día anterior">◀ −1 día</button>
                <button type="button" class="btn-secundario" id="btnHoy">Hoy</button>
                <button type="button" class="btn-secundario" id="btnNextDia" title="Día siguiente">+1 día ▶</button>
                <label class="btn-secundario btn-calendario" title="Elegir desde el calendario">
                    📅 Calendario
                    <input type="date" id="fechaGregoriana">
                </label>
            </div>
        </div>

        <!-- Estela: inscripción de Serie Inicial con la fecha calculada -->
        <div id="estela-container" hidden>
            <div class="postal" id="postal">
                <div class="estela" id="estela">
                    <div class="estela-marco" id="estela-marco"></div>
                    <div class="estela-campo">
                        <div class="estela-isig">
                            <img src="imagenes/encabezados/calendar-capstone.png" alt="Glifo Introductorio de Serie Inicial">
                        </div>
                        <div class="estela-bloques" id="estela-bloques"></div>
                    </div>
                </div>
                <div class="postal-pie">
                    <p class="estela-pie" id="estela-pie"></p>
                    <p class="fecha-gregoriana-chica" id="fecha-gregoriana-texto"></p>
                </div>
            </div>
            <div class="acciones-descarga">
                <button type="button" id="btnDescargarJpg">🖼 Descargar postal (JPG)</button>
                <button type="button" id="btnDescargarPdf">📄 Descargar postal (PDF)</button>
            </div>
        </div>

        <div id="resultado-container">
            <div class="calendario-resultado" id="long-count-result">
                <h3>Cuenta Larga</h3>
                <div class="glifo-container" id="long-count-glyphs"></div>
                <p class="fecha-texto" id="long-count-text"></p>
            </div>
            <div class="calendario-resultado" id="tzolkin-result">
                <h3>Tzolk'in (Calendario Sagrado)</h3>
                <div class="glifo-container" id="tzolkin-glyphs"></div>
                <p class="fecha-texto" id="tzolkin-text"></p>
            </div>
            <div class="calendario-resultado" id="haab-result">
                <h3>Haab' (Calendario Civil)</h3>
                <div class="glifo-container" id="haab-glyphs"></div>
                <p class="fecha-texto" id="haab-text"></p>
            </div>
        </div>
    </div>

    <script src="glifos-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
