<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Calculadora desarrollada por Enrique Franco — Calendario Maya</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px 0;
        }
        .container {
            position: relative;
            background-color: #ffffff;
            padding: 46px 28px 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 560px;
            width: 94%;
        }
        /* Selector de idioma con banderas en la esquina superior derecha */
        .lang-switcher {
            position: absolute;
            top: 12px;
            right: 14px;
            display: inline-flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #f4efe6;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid #e0d5c1;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: none;
            background: transparent;
            padding: 4px 8px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 11.5px;
            font-weight: 700;
            color: #6b5a45;
            opacity: 0.65;
            transition: all 0.2s ease;
        }
        .lang-btn:hover {
            opacity: 0.95;
        }
        .lang-btn.activo {
            background: #ffffff;
            color: #3b2d1f;
            opacity: 1;
            box-shadow: 0 1px 4px rgba(60, 45, 30, 0.18);
        }
        .lang-btn svg {
            width: 21px;
            height: 14px;
            border-radius: 2px;
            box-shadow: 0 0 1px rgba(0, 0, 0, 0.45);
            flex-shrink: 0;
        }
        h1 {
            color: #8C5E35;
            margin: 10px 0 4px;
        }
        p.autor {
            margin: 0 0 10px;
            font-size: 15px;
            font-weight: 600;
            color: #6b533b;
        }
        p.subtitulo {
            margin: 0;
            color: #555;
            line-height: 1.5;
        }
        .selector-fecha {
            margin-top: 18px;
            padding: 14px 12px;
            background: #f8f6f2;
            border: 1px solid #e5dec9;
            border-radius: 12px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }
        .selector-controles {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: flex-end;
            flex-wrap: nowrap;
        }
        .campo-fecha {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            min-width: 0;
        }
        .campo-fecha label {
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #7a6a55;
        }
        .campo-fecha select,
        .campo-fecha input[type="number"] {
            padding: 8px 8px;
            border: 1px solid #cbbba0;
            border-radius: 8px;
            background-color: #fff;
            font-size: 14.5px;
            color: #333;
            outline: none;
        }
        .campo-fecha select:focus,
        .campo-fecha input[type="number"]:focus {
            border-color: #8C5E35;
            box-shadow: 0 0 0 3px rgba(140, 94, 53, 0.15);
        }
        .campo-mes { flex: 0 1 118px; }
        .campo-mes select { width: 100%; }
        .anio-grupo { display: flex; gap: 5px; }
        .anio-grupo input[type="number"] { width: 64px; }
        .selector-acciones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: nowrap;
        }
        .btn-secundario {
            background-color: #ece6da;
            color: #5a4632;
            border: 1px solid #d5cab6;
            padding: 7px 11px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        @media (max-width: 480px) {
            .container {
                padding: 46px 12px 22px;
                width: 96%;
            }
            h1 {
                font-size: 1.4rem;
            }
            .selector-fecha {
                padding: 12px 8px;
            }
            .selector-controles {
                gap: 5px;
            }
            .campo-fecha select,
            .campo-fecha input[type="number"] {
                padding: 7px 5px;
                font-size: 13px;
            }
            .campo-mes {
                flex: 1 1 88px;
                max-width: 102px;
            }
            .anio-grupo {
                gap: 4px;
            }
            .anio-grupo input[type="number"] {
                width: 54px;
            }
            .selector-acciones {
                gap: 4px;
            }
            .btn-secundario {
                padding: 6px 8px;
                font-size: 12px;
            }
        }
        .btn-secundario:hover { background-color: #dfd6c5; }
        .btn-calendario {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            overflow: hidden;
        }
        .btn-calendario input[type="date"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
            margin: 0;
        }
        .visor-postal {
            position: relative;
            margin-top: 24px;
        }
        .visor-postal img {
            width: 100%;
            max-width: 480px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(40, 30, 18, 0.16);
            transition: opacity 0.2s ease;
        }
        .visor-postal.cargando img {
            opacity: 0.55;
        }
        .acciones-descarga {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn-descarga {
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14.5px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-jpg {
            background-color: #5D8B71;
            box-shadow: 0 2px 8px rgba(93, 139, 113, 0.25);
        }
        .btn-jpg:hover { background-color: #4A6F5A; }
        .btn-pdf {
            background-color: #8C5E35;
            box-shadow: 0 2px 8px rgba(140, 94, 53, 0.25);
        }
        .btn-pdf:hover { background-color: #724b29; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Selector gráfico de idioma (México, USA, Francia, Japón, China) -->
        <div class="lang-switcher" role="group" aria-label="Language selector">
            <button type="button" class="lang-btn activo" data-lang="es" title="Español (México)">
                <svg viewBox="0 0 21 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="7" height="15" x="0" fill="#006847"/>
                    <rect width="7" height="15" x="7" fill="#ffffff"/>
                    <rect width="7" height="15" x="14" fill="#ce1126"/>
                    <circle cx="10.5" cy="7.5" r="1.9" fill="#8c5e35"/>
                </svg>
                <span>ES</span>
            </button>
            <button type="button" class="lang-btn" data-lang="en" title="English (USA)">
                <svg viewBox="0 0 21 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="21" height="15" fill="#b22234"/>
                    <path d="M0,2.3h21 M0,4.6h21 M0,6.9h21 M0,9.2h21 M0,11.5h21 M0,13.8h21" stroke="#ffffff" stroke-width="1.15"/>

                        <circle cx="1.8" cy="1.6" r="0.5"/><circle cx="3.6" cy="1.6" r="0.5"/><circle cx="5.4" cy="1.6" r="0.5"/><circle cx="7.2" cy="1.6" r="0.5"/>

                        <circle cx="2.7" cy="5.2" r="0.5"/><circle cx="4.5" cy="5.2" r="0.5"/><circle cx="6.3" cy="5.2" r="0.5"/>
                        <circle cx="1.8" cy="6.4" r="0.5"/><circle cx="3.6" cy="6.4" r="0.5"/><circle cx="5.4" cy="6.4" r="0.5"/><circle cx="7.2" cy="6.4" r="0.5"/>
                    </g>
                </svg>
                <span>EN</span>
            </button>
            <button type="button" class="lang-btn" data-lang="fr" title="Français (France)">
                <svg viewBox="0 0 21 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="7" height="15" x="0" fill="#002395"/>
                    <rect width="7" height="15" x="7" fill="#ffffff"/>
                    <rect width="7" height="15" x="14" fill="#ed2939"/>
                </svg>
                <span>FR</span>
            </button>
            <button type="button" class="lang-btn" data-lang="ja" title="日本語 (Japan)">
                <svg viewBox="0 0 21 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="21" height="15" fill="#ffffff"/>
                    <circle cx="10.5" cy="7.5" r="4.3" fill="#bc002d"/>
                </svg>
                <span>日本語</span>
            </button>
            <button type="button" class="lang-btn" data-lang="zh" title="中文 (China)">
                <svg viewBox="0 0 21 15" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <rect width="21" height="15" fill="#de2910"/>
                    <polygon points="4.2,2.2 4.8,4.1 6.7,4.1 5.1,5.2 5.7,7.1 4.2,5.9 2.7,7.1 3.3,5.2 1.7,4.1 3.6,4.1" fill="#ffde00"/>
                    <g fill="#ffde00">
                        <circle cx="8.2" cy="1.8" r="0.65"/>
                        <circle cx="9.6" cy="3.3" r="0.65"/>
                        <circle cx="9.6" cy="5.5" r="0.65"/>
                        <circle cx="8.2" cy="7.0" r="0.65"/>
                    </g>
                </svg>
                <span>中文</span>
            </button>
        </div>

        <h1 id="txtHeading">Crea una Estela Maya con tu fecha memorable!</h1>
        <p class="autor" id="txtAutor">Calculadora desarrollada por Enrique Franco</p>
        <p class="subtitulo" id="txtSubtitulo">Selecciona tu fecha</p>

        <div class="selector-fecha" id="selectorFechaBox" aria-label="Selector de fecha">
            <div class="selector-controles">
                <div class="campo-fecha">
                    <label for="selectDia" id="lblDia">Día</label>
                    <select id="selectDia"></select>
                </div>
                <div class="campo-fecha campo-mes">
                    <label for="selectMes" id="lblMes">Mes</label>
                    <select id="selectMes">
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Septiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                </div>
                <div class="campo-fecha campo-anio">
                    <label for="inputAnio" id="lblAnio">Año</label>
                    <div class="anio-grupo">
                        <input type="number" id="inputAnio" min="1" max="4772" value="{{ hoy_anio }}">
                        <select id="selectEra" aria-label="Era">
                            <option value="dc" id="optEraDc">d. C.</option>
                            <option value="ac" id="optEraAc">a. C.</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="selector-acciones">
                <button type="button" class="btn-secundario" id="btnPrevDia" title="Día anterior">◀ −1 día</button>
                <button type="button" class="btn-secundario" id="btnHoy">Hoy</button>
                <button type="button" class="btn-secundario" id="btnNextDia" title="Día siguiente">+1 día ▶</button>
                <label class="btn-secundario btn-calendario" id="lblBtnCalendario" title="Elegir desde el calendario">
                    <span id="txtCalendario">📅 Calendario</span>
                    <input type="date" id="fechaGregoriana">
                </label>
            </div>
        </div>

        <div class="visor-postal" id="visorPostal">
            <img id="imagenPostal" alt="Postal de estela maya generada por el servidor">
        </div>

        <div class="acciones-descarga">
            <a class="btn-descarga btn-jpg" id="linkDescargarJpg" href="#">🖼 Descargar postal (JPG)</a>
            <a class="btn-descarga btn-pdf" id="linkDescargarPdf" href="#">📄 Descargar postal (PDF)</a>
        </div>
    </div>

    <script>
        const I18N = {
            es: {
                pageTitle: 'Calculadora desarrollada por Enrique Franco — Calendario Maya',
                heading: 'Crea una Estela Maya con tu fecha memorable!',
                autor: 'Calculadora desarrollada por Enrique Franco',
                subtitulo: 'Selecciona tu fecha',
                lblDia: 'Día',
                lblMes: 'Mes',
                lblAnio: 'Año',
                meses: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
                eraDc: 'd. C.',
                eraAc: 'a. C.',
                prevDia: '◀ −1 día',
                prevDiaTitle: 'Día anterior',
                hoy: 'Hoy',
                nextDia: '+1 día ▶',
                nextDiaTitle: 'Día siguiente',
                calendario: '📅 Calendario',
                calendarioTitle: 'Elegir desde el calendario',
                descJpg: '🖼 Descargar postal (JPG)',
                descPdf: '📄 Descargar postal (PDF)',
                altPostal: 'Postal de estela maya generada por el servidor',
            },
            en: {
                pageTitle: 'Calculator developed by Enrique Franco — Mayan Calendar',
                heading: 'Create a Mayan Stela with your memorable date!',
                autor: 'Calculator developed by Enrique Franco',
                subtitulo: 'Select your date',
                lblDia: 'Day',
                lblMes: 'Month',
                lblAnio: 'Year',
                meses: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
                eraDc: 'AD',
                eraAc: 'BC',
                prevDia: '◀ −1 day',
                prevDiaTitle: 'Previous day',
                hoy: 'Today',
                nextDia: '+1 day ▶',
                nextDiaTitle: 'Next day',
                calendario: '📅 Calendar',
                calendarioTitle: 'Pick from calendar',
                descJpg: '🖼 Download postcard (JPG)',
                descPdf: '📄 Download postcard (PDF)',
                altPostal: 'Mayan stela postcard generated by the server',
            },
            fr: {
                pageTitle: 'Calculatrice développée par Enrique Franco — Calendrier Maya',
                heading: 'Créez une Stèle Maya avec votre date mémorable !',
                autor: 'Calculatrice développée par Enrique Franco',
                subtitulo: 'Sélectionnez votre date',
                lblDia: 'Jour',
                lblMes: 'Mois',
                lblAnio: 'Année',
                meses: ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'],
                eraDc: 'ap. J.-C.',
                eraAc: 'av. J.-C.',
                prevDia: '◀ −1 jour',
                prevDiaTitle: 'Jour précédent',
                hoy: "Aujourd'hui",
                nextDia: '+1 jour ▶',
                nextDiaTitle: 'Jour suivant',
                calendario: '📅 Calendrier',
                calendarioTitle: 'Choisir dans le calendrier',
                descJpg: '🖼 Télécharger la carte (JPG)',
                descPdf: '📄 Télécharger la carte (PDF)',
                altPostal: 'Carte postale de stèle maya générée par le serveur',
            },
            ja: {
                pageTitle: 'Enrique Franco 開発の計算機 — マヤ暦',
                heading: '思い出の日付でマヤ石碑を作ろう！',
                autor: 'Enrique Franco 開発の計算機',
                subtitulo: '日付を選択してください',
                lblDia: '日',
                lblMes: '月',
                lblAnio: '年',
                meses: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                eraDc: '西暦',
                eraAc: '紀元前',
                prevDia: '◀ 前日',
                prevDiaTitle: '前日',
                hoy: '今日',
                nextDia: '翌日 ▶',
                nextDiaTitle: '翌日',
                calendario: '📅 カレンダー',
                calendarioTitle: 'カレンダーから選択',
                descJpg: '🖼 ポストカードを保存 (JPG)',
                descPdf: '📄 ポストカードを保存 (PDF)',
                altPostal: 'サーバーで生成されたマヤ石碑のポストカード',
            },
            zh: {
                pageTitle: 'Enrique Franco 开发的计算器 — 玛雅历法',
                heading: '用你难忘的日期创建玛雅石碑！',
                autor: 'Enrique Franco 开发的计算器',
                subtitulo: '请选择日期',
                lblDia: '日',
                lblMes: '月',
                lblAnio: '年',
                meses: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'],
                eraDc: '公元',
                eraAc: '公元前',
                prevDia: '◀ 前一天',
                prevDiaTitle: '前一天',
                hoy: '今天',
                nextDia: '后一天 ▶',
                nextDiaTitle: '后一天',
                calendario: '📅 日历',
                calendarioTitle: '从日历中选择',
                descJpg: '🖼 下载明信片 (JPG)',
                descPdf: '📄 下载明信片 (PDF)',
                altPostal: '服务器生成的玛雅石碑明信片',
            },
        };

        let idiomaActual = '{{ lang_inicial|default:"es" }}';

        const selectDia = document.getElementById('selectDia');
        const selectMes = document.getElementById('selectMes');
        const inputAnio = document.getElementById('inputAnio');
        const selectEra = document.getElementById('selectEra');
        const fechaInput = document.getElementById('fechaGregoriana');
        const visorPostal = document.getElementById('visorPostal');
        const imagenPostal = document.getElementById('imagenPostal');
        const linkJpg = document.getElementById('linkDescargarJpg');
        const linkPdf = document.getElementById('linkDescargarPdf');
        const botonesIdioma = document.querySelectorAll('.lang-btn');

        function aplicarIdioma(lang) {
            idiomaActual = I18N[lang] ? lang : 'es';
            const t = I18N[idiomaActual];
            document.documentElement.lang = idiomaActual;
            document.title = t.pageTitle;
            document.getElementById('txtHeading').textContent = t.heading;
            document.getElementById('txtAutor').textContent = t.autor;
            document.getElementById('txtSubtitulo').textContent = t.subtitulo;
            document.getElementById('lblDia').textContent = t.lblDia;
            document.getElementById('lblMes').textContent = t.lblMes;
            document.getElementById('lblAnio').textContent = t.lblAnio;

            Array.from(selectMes.options).forEach((opt, idx) => {
                opt.textContent = t.meses[idx];
            });

            document.getElementById('optEraDc').textContent = t.eraDc;
            document.getElementById('optEraAc').textContent = t.eraAc;

            const btnPrev = document.getElementById('btnPrevDia');
            btnPrev.textContent = t.prevDia;
            btnPrev.title = t.prevDiaTitle;

            document.getElementById('btnHoy').textContent = t.hoy;

            const btnNext = document.getElementById('btnNextDia');
            btnNext.textContent = t.nextDia;
            btnNext.title = t.nextDiaTitle;

            document.getElementById('txtCalendario').textContent = t.calendario;
            document.getElementById('lblBtnCalendario').title = t.calendarioTitle;

            linkJpg.textContent = t.descJpg;
            linkPdf.textContent = t.descPdf;
            imagenPostal.alt = t.altPostal;

            botonesIdioma.forEach(btn => {
                btn.classList.toggle('activo', btn.dataset.lang === idiomaActual);
            });

            actualizarPostal();
        }

        function anioAstro() {
            const a = Math.max(1, parseInt(inputAnio.value, 10) || 1);
            return selectEra.value === 'ac' ? 1 - a : a;
        }

        function diasEnMes(m, y) {
            const bisiesto = (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0);
            return [31, bisiesto ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1] || 31;
        }

        function actualizarOpcionesDia() {
            const m = parseInt(selectMes.value, 10) || 1;
            const maxD = diasEnMes(m, anioAstro());
            const prev = parseInt(selectDia.value, 10) || 1;
            selectDia.innerHTML = '';
            for (let d = 1; d <= maxD; d++) {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                selectDia.appendChild(opt);
            }
            selectDia.value = Math.min(prev, maxD);
        }

        function actualizarPostal() {
            const params = new URLSearchParams({
                dia: selectDia.value || 1,
                mes: selectMes.value || 1,
                anio: Math.max(1, parseInt(inputAnio.value, 10) || 1),
                era: selectEra.value,
                lang: idiomaActual,
            });
            visorPostal.classList.add('cargando');
            imagenPostal.src = `/postal.jpg?${params.toString()}`;
            linkJpg.href = `/postal.jpg?${params.toString()}&descargar=1`;
            linkPdf.href = `/postal.pdf?${params.toString()}`;
        }

        imagenPostal.addEventListener('load', () => visorPostal.classList.remove('cargando'));

        function establecerFecha(d, m, yAstro) {
            if (yAstro <= 0) {
                selectEra.value = 'ac';
                inputAnio.value = 1 - yAstro;
            } else {
                selectEra.value = 'dc';
                inputAnio.value = yAstro;
            }
            selectMes.value = m;
            actualizarOpcionesDia();
            selectDia.value = Math.min(d, diasEnMes(m, yAstro));
            actualizarPostal();
        }

        function moverDias(delta) {
            let d = parseInt(selectDia.value, 10) + delta;
            let m = parseInt(selectMes.value, 10);
            let y = anioAstro();
            while (d > diasEnMes(m, y)) {
                d -= diasEnMes(m, y);
                m++;
                if (m > 12) { m = 1; y++; }
            }
            while (d < 1) {
                m--;
                if (m < 1) { m = 12; y--; }
                d += diasEnMes(m, y);
            }
            establecerFecha(d, m, y);
        }

        botonesIdioma.forEach(btn => {
            btn.addEventListener('click', () => aplicarIdioma(btn.dataset.lang));
        });

        selectMes.addEventListener('change', () => { actualizarOpcionesDia(); actualizarPostal(); });
        selectDia.addEventListener('change', actualizarPostal);
        inputAnio.addEventListener('input', () => { actualizarOpcionesDia(); actualizarPostal(); });
        selectEra.addEventListener('change', () => { actualizarOpcionesDia(); actualizarPostal(); });

        document.getElementById('btnHoy').addEventListener('click', () => {
            const h = new Date();
            establecerFecha(h.getDate(), h.getMonth() + 1, h.getFullYear());
        });
        document.getElementById('btnPrevDia').addEventListener('click', () => moverDias(-1));
        document.getElementById('btnNextDia').addEventListener('click', () => moverDias(1));

        fechaInput.addEventListener('click', () => {
            if (typeof fechaInput.showPicker === 'function') {
                try { fechaInput.showPicker(); } catch (_) {}
            }
        });
        fechaInput.addEventListener('change', () => {
            if (!fechaInput.value) return;
            const [y, m, d] = fechaInput.value.split('-').map(Number);
            if (y && m && d) establecerFecha(d, m, y);
        });

        establecerFecha({{ hoy_dia }}, {{ hoy_mes }}, {{ hoy_anio }});
        if (idiomaActual !== 'es') aplicarIdioma(idiomaActual);
    </script>
</body>
</html>
